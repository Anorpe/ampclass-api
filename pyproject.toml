[tool.poetry]
name = "ampclass-api"
version = "0.1.0"
description = "API para predicción de péptidos antimicrobianos"
authors = ["Andres Orrego Perez <aorregop@unal.edu.co>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
flask = "^3.0.0"
flask-cors = "^4.0.0"
pandas = "^2.0.0"
modlamp = "^4.3.0"
biopython = "^1.84"
pyfasta = "^0.5.2"
tqdm = "^4.66.6"
future = "^1.0.0"
scikit-learn = "1.3.2"
xgboost = "^2.1.2"
requests = "^2.0.0"
jsonschema = "^4.0.0"
uvicorn = "^0.30.0"
gunicorn = "^23.0.0"
openpyxl = "^3.1.0"
joblib = "^1.4.0"
scipy = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
